name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
      mysql:
        image: mysql:8.0.40
        env:
          MYSQL_ROOT_PASSWORD: ci-root-only
          MYSQL_DATABASE: score_test
          MYSQL_USER: score
          MYSQL_PASSWORD: ci-score-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-root-only"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=30
      mysql_restore:
        image: mysql:8.0.40
        env:
          MYSQL_ROOT_PASSWORD: ci-restore-only
          MYSQL_ROOT_HOST: "%"
        ports:
          - 33306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-restore-only"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=30
    env:
      SCORE_TEST_RESTORE_SERVER_URL: mysql+pymysql://root:ci-restore-only@127.0.0.1:33306/mysql
      SCORE_TEST_REDIS_URL: redis://127.0.0.1:6379/15
      SCORE_TEST_DATABASE_URL: mysql+pymysql://score:ci-score-only@127.0.0.1:3306/score_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: ruff check .
      - run: ruff format --check .
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mysql-client
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare isolated dummy configuration and certificate
        run: |
          cp infra/.env.example .env.production
          python -c "from pathlib import Path; p=Path('.env.production'); p.write_text(p.read_text().replace('REPLACE_WITH_64_RANDOM_HEX_CHARACTERS', 'ab' * 32))"
          mkdir -p infra/tls/web infra/tls/mysql
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=score.example.org -keyout infra/tls/web/privkey.pem -out infra/tls/web/fullchain.pem
      - name: Validate Compose and build production images
        run: |
          docker compose --env-file .env.production -f compose.production.yaml config --quiet
          docker compose --env-file .env.production -f compose.production.yaml build
      - name: Validate TLS configuration and production settings
        run: |
          docker compose --env-file .env.production -f compose.production.yaml run --rm --no-deps web nginx -t
          docker compose --env-file .env.production -f compose.production.yaml run --rm --no-deps api python -c "from score_api.core.config import Settings; Settings()"
