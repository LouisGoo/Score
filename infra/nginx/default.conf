map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
map $status $log_failure {
    ~^5 1;
    default 0;
}
# Never log URI/query/headers/IP: WS tickets may be in the query string.
log_format failure escape=json '{"time":"$time_iso8601","event":"proxy_failed","status":$status,"request_id":"$upstream_http_x_request_id"}';
access_log /dev/stdout failure if=$log_failure;
error_log /dev/null;

server {
    listen 80;
    server_name _;
    return 404;
}
server {
    listen 443 ssl;
    server_name _;
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    root /usr/share/nginx/html;
    client_max_body_size 2m;

    location = /api { return 404; }
    location ^~ /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api http://api:8000;
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }
    location /assets/ { try_files $uri =404; }
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
