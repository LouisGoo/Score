<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>现场评分 · 液态玻璃</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC",
      "Helvetica Neue", sans-serif;
    color: #1a2e22;
    background:
      radial-gradient(ellipse 80% 60% at 15% 20%, rgba(168, 210, 180, 0.85) 0%, transparent 55%),
      radial-gradient(ellipse 70% 50% at 85% 15%, rgba(160, 195, 220, 0.7) 0%, transparent 50%),
      radial-gradient(ellipse 60% 55% at 70% 85%, rgba(210, 200, 160, 0.65) 0%, transparent 55%),
      radial-gradient(ellipse 50% 40% at 20% 80%, rgba(180, 200, 190, 0.5) 0%, transparent 50%),
      linear-gradient(165deg, #e8ebe4 0%, #dfe8e2 40%, #e6e4d8 100%);
    -webkit-font-smoothing: antialiased;
    padding: 28px 36px 20px;
    display: flex;
    flex-direction: column;
  }

  .glass {
    position: relative;
    isolation: isolate;
    border-radius: 24px;
    border: 1px solid rgba(255, 255, 255, 0.55);
    background: rgba(255, 255, 255, 0.38);
    backdrop-filter: blur(28px) saturate(160%);
    -webkit-backdrop-filter: blur(28px) saturate(160%);
    box-shadow:
      0 12px 40px rgba(40, 60, 50, 0.1),
      inset 0 1px 0 rgba(255, 255, 255, 0.7),
      inset 0 -1px 0 rgba(255, 255, 255, 0.2);
    overflow: hidden;
  }

  .glass::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background: linear-gradient(
      145deg,
      rgba(255, 255, 255, 0.35) 0%,
      rgba(255, 255, 255, 0.05) 40%,
      rgba(255, 255, 255, 0) 70%
    );
    pointer-events: none;
    z-index: 0;
  }

  .glass > * { position: relative; z-index: 1; }

  /* Header */
  .header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 22px;
    padding: 0 4px;
  }

  .eyebrow {
    font-size: 14px;
    color: rgba(60, 80, 70, 0.55);
    margin-bottom: 4px;
  }

  .title {
    font-size: 42px;
    font-weight: 700;
    letter-spacing: -0.03em;
    color: #0f2a1c;
    line-height: 1.1;
  }

  .btn-fullscreen {
    appearance: none;
    border: 1px solid rgba(255, 255, 255, 0.6);
    background: rgba(255, 255, 255, 0.45);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-radius: 12px;
    padding: 10px 18px;
    font-size: 14px;
    color: #2a3d32;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(40, 60, 50, 0.08), inset 0 1px 0 rgba(255,255,255,0.7);
  }

  /* Main layout */
  .main {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 320px;
    gap: 22px;
    min-height: 0;
  }

  .panel-main {
    padding: 36px 40px 28px;
    display: flex;
    flex-direction: column;
  }

  .status {
    font-size: 15px;
    font-weight: 600;
    color: #c45a28;
    margin-bottom: 10px;
  }

  .name {
    font-size: 72px;
    font-weight: 700;
    letter-spacing: -0.03em;
    color: #0a1f14;
    line-height: 1.05;
    margin-bottom: 28px;
  }

  .stats-row {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 40px;
    margin-bottom: 28px;
  }

  .stat-label {
    font-size: 14px;
    color: rgba(40, 60, 50, 0.5);
    margin-bottom: 8px;
  }

  .stat-value {
    font-size: 56px;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: #0a1f14;
    line-height: 1;
  }

  .stat-time .stat-value {
    font-size: 64px;
    color: #1a5c3a;
  }

  .divider {
    height: 6px;
    border-radius: 3px;
    background: linear-gradient(90deg, #1a6e41 0%, #2a8f58 60%, rgba(26, 110, 65, 0.3) 100%);
    margin: 8px 0 20px;
    box-shadow: 0 2px 8px rgba(26, 110, 65, 0.25);
  }

  .wait-msg {
    font-size: 15px;
    color: rgba(40, 60, 50, 0.55);
    line-height: 1.5;
  }

  /* QR panel */
  .panel-side {
    padding: 28px 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .qr-wrap {
    width: 200px;
    height: 200px;
    border-radius: 16px;
    background: rgba(255, 255, 255, 0.85);
    border: 1px solid rgba(255, 255, 255, 0.7);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), 0 4px 16px rgba(40,60,50,0.08);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 18px;
    padding: 12px;
  }

  .qr-wrap svg { width: 100%; height: 100%; }

  .qr-title {
    font-size: 18px;
    font-weight: 700;
    color: #0a1f14;
    margin-bottom: 16px;
  }

  .code-label {
    font-size: 13px;
    color: rgba(40, 60, 50, 0.5);
    margin-bottom: 6px;
  }

  .code-value {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.06em;
    color: #0a1f14;
    font-variant-numeric: tabular-nums;
    margin-bottom: 20px;
    word-break: break-all;
  }

  .judge-note {
    font-size: 12px;
    color: rgba(40, 60, 50, 0.45);
    line-height: 1.5;
    margin-top: auto;
  }

  /* Footer */
  .footer {
    margin-top: 18px;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-radius: 16px;
  }

  .sync {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: rgba(40, 60, 50, 0.55);
  }

  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #2a8f58;
    box-shadow: 0 0 0 3px rgba(42, 143, 88, 0.2);
  }

  .btn-resync {
    appearance: none;
    border: 1px solid rgba(255, 255, 255, 0.55);
    background: rgba(255, 255, 255, 0.5);
    border-radius: 10px;
    padding: 8px 16px;
    font-size: 13px;
    color: #2a3d32;
    cursor: pointer;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.7);
  }
</style>
</head>
<body>
  <header class="header">
    <div>
      <p class="eyebrow">现场评分</p>
      <h1 class="title">测试0</h1>
    </div>
    <button type="button" class="btn-fullscreen">全屏显示</button>
  </header>

  <div class="main">
    <section class="glass panel-main">
      <p class="status">评分已暂停 · 001</p>
      <h2 class="name">lyt</h2>
      <div class="stats-row">
        <div>
          <p class="stat-label">已交 / 应交</p>
          <p class="stat-value">1 / 1</p>
        </div>
        <div class="stat-time">
          <p class="stat-label">剩余时间已冻结</p>
          <p class="stat-value">不限时</p>
        </div>
      </div>
      <div class="divider"></div>
      <p class="wait-msg">请稍候，主持人恢复后可继续提交。</p>
    </section>

    <aside class="glass panel-side">
      <div class="qr-wrap" aria-hidden="true">
        <!-- Decorative QR-like pattern -->
        <svg viewBox="0 0 29 29" xmlns="http://www.w3.org/2000/svg">
          <rect width="29" height="29" fill="#fff"/>
          <g fill="#111">
            <rect x="1" y="1" width="9" height="9"/>
            <rect x="3" y="3" width="5" height="5" fill="#fff"/>
            <rect x="4" y="4" width="3" height="3"/>
            <rect x="19" y="1" width="9" height="9"/>
            <rect x="21" y="3" width="5" height="5" fill="#fff"/>
            <rect x="22" y="4" width="3" height="3"/>
            <rect x="1" y="19" width="9" height="9"/>
            <rect x="3" y="21" width="5" height="5" fill="#fff"/>
            <rect x="4" y="22" width="3" height="3"/>
            <rect x="12" y="1" width="2" height="2"/><rect x="15" y="1" width="2" height="2"/>
            <rect x="12" y="4" width="2" height="2"/><rect x="16" y="4" width="1" height="2"/>
            <rect x="13" y="7" width="2" height="2"/><rect x="16" y="7" width="2" height="2"/>
            <rect x="1" y="12" width="2" height="2"/><rect x="4" y="12" width="2" height="2"/>
            <rect x="7" y="13" width="2" height="2"/><rect x="10" y="12" width="2" height="3"/>
            <rect x="13" y="12" width="3" height="2"/><rect x="17" y="12" width="2" height="2"/>
            <rect x="20" y="12" width="2" height="2"/><rect x="23" y="13" width="2" height="2"/>
            <rect x="26" y="12" width="2" height="2"/>
            <rect x="12" y="16" width="2" height="2"/><rect x="15" y="15" width="2" height="2"/>
            <rect x="18" y="16" width="3" height="2"/><rect x="22" y="15" width="2" height="2"/>
            <rect x="25" y="17" width="2" height="2"/>
            <rect x="12" y="19" width="2" height="2"/><rect x="15" y="20" width="2" height="2"/>
            <rect x="18" y="19" width="2" height="3"/><rect x="21" y="21" width="2" height="2"/>
            <rect x="24" y="20" width="2" height="2"/><rect x="27" y="22" width="1" height="2"/>
            <rect x="12" y="23" width="2" height="2"/><rect x="15" y="25" width="3" height="2"/>
            <rect x="19" y="24" width="2" height="2"/><rect x="22" y="26" width="2" height="2"/>
            <rect x="25" y="24" width="3" height="2"/><rect x="12" y="27" width="2" height="1"/>
          </g>
        </svg>
      </div>
      <p class="qr-title">扫码加入活动</p>
      <p class="code-label">活动码</p>
      <p class="code-value">E7DQ8NWWYKGF</p>
      <p class="judge-note">评委请使用主办方提供的身份码</p>
    </aside>
  </div>

  <footer class="glass footer">
    <div class="sync">
      <span class="dot" aria-hidden="true"></span>
      <span>已同步 · 最后同步 12:45:05</span>
    </div>
    <button type="button" class="btn-resync">重新同步</button>
  </footer>
</body>
</html>
